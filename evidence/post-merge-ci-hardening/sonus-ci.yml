name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: rust reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - name: Require private interface read token
        shell: bash
        env:
          TOKEN: ${{ secrets.SONUS_AURIS_INTERFACES_TOKEN }}
        run: test -n "$TOKEN"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
        env: &private_git_auth
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SONUS_AURIS_INTERFACES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
      - run: cargo test --all-targets --locked
        env: *private_git_auth
      - name: Core crate builds alone
        run: cargo build --locked -p sonus-auris-lib
        env: *private_git_auth
      - name: Corpus is current
        run: cargo run --locked --example corpus -- --check
        env: *private_git_auth

  wasm:
    name: wasm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - name: Require private interface read token
        shell: bash
        env:
          TOKEN: ${{ secrets.SONUS_AURIS_INTERFACES_TOKEN }}
        run: test -n "$TOKEN"
      - run: cargo build --locked -p sonus-auris-lib-wasm --target wasm32-unknown-unknown
        env: *private_git_auth

  ffi:
    name: ffi artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - name: Require private interface read token
        shell: bash
        env:
          TOKEN: ${{ secrets.SONUS_AURIS_INTERFACES_TOKEN }}
        run: test -n "$TOKEN"
      - run: cargo build --locked -p sonus-auris-lib-ffi
        env: *private_git_auth
      - run: cargo test --locked -p sonus-auris-lib-ffi
        env: *private_git_auth

  dart:
    name: dart port
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - name: Require private interface read token
        shell: bash
        env:
          TOKEN: ${{ secrets.SONUS_AURIS_INTERFACES_TOKEN }}
        run: test -n "$TOKEN"
      - run: dart pub get
        env: *private_git_auth
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  typescript:
    name: typescript port
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Vendored interfaces are intact
        run: npm run check-vendor
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  differential:
    name: differential fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Require private interface read token
        shell: bash
        env:
          TOKEN: ${{ secrets.SONUS_AURIS_INTERFACES_TOKEN }}
        run: test -n "$TOKEN"
      - run: dart pub get
        working-directory: dart
        env: *private_git_auth
      - run: npm ci
        working-directory: typescript
      - name: Fuzz all three implementations
        run: ./run.py --count 3000 --seed 1
        working-directory: conformance/differential
        env: *private_git_auth

  conformance:
    name: all implementations agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [rust, wasm, ffi, dart, typescript, differential]
    if: always()
    steps:
      - name: Verify every implementation passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::an implementation did not pass; the rule engine is not in agreement"
              exit 1
            fi
          done
