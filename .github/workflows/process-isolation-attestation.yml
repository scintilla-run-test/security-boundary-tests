name: Process isolation attestation proof

on:
  pull_request:
    paths:
      - '.github/workflows/process-isolation-attestation.yml'
      - 'evidence/ores-proc-isolation-cli-25/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/process-isolation-attestation.yml'
      - 'evidence/ores-proc-isolation-cli-25/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact production blob identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/ores-proc-isolation-cli-25'
          for file in linux_attestation.rs linux_runtime_binding.rs; do
            expected="$(jq -r --arg file "$file" '.files[$file]' "$root/source-lock.json")"
            actual="$(git hash-object "$root/$file")"
            test "$actual" = "$expected" || {
              echo "vendored production source does not match locked blob for $file: expected=$expected actual=$actual" >&2
              exit 1
            }
          done
          commit="$(jq -r '.commit_sha' "$root/source-lock.json")"
          case "$commit" in
            (*[!0-9a-f]*|'') echo 'invalid production commit lock' >&2; exit 1 ;;
          esac
          test "${#commit}" -eq 40

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Format exact-source proof harness
        working-directory: evidence/ores-proc-isolation-cli-25
        run: cargo fmt --all -- --check

      - name: Lint exact-source proof harness
        working-directory: evidence/ores-proc-isolation-cli-25
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run exact-source unit and live negative tests
        working-directory: evidence/ores-proc-isolation-cli-25
        run: cargo test --all-targets

      - name: Prove unsafe Rust remains forbidden
        working-directory: evidence/ores-proc-isolation-cli-25
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-string 'unsafe {' . --include='*.rs'; then
            echo 'unsafe Rust found in process-isolation proof source' >&2
            exit 1
          fi
