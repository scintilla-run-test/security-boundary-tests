name: generate TypeScript lockfiles

on:
  push:
    branches:
      - proof/generate-ts-lockfiles-20260928
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Generate missing lockfiles with npm
        shell: bash
        run: |
          set -euo pipefail
          for dir in evidence/ts-lockfiles/athleto-pub-lib-core evidence/ts-lockfiles/claritas-sync; do
            if [ ! -f "$dir/package-lock.json" ]; then
              (
                cd "$dir"
                npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              )
            fi
          done
      - name: Prove lockfiles install deterministically
        shell: bash
        run: |
          set -euo pipefail
          for dir in evidence/ts-lockfiles/athleto-pub-lib-core evidence/ts-lockfiles/claritas-sync; do
            test -s "$dir/package-lock.json"
            (
              cd "$dir"
              rm -rf node_modules
              npm ci --ignore-scripts --no-audit --no-fund
              node -e "const p=require('./node_modules/typescript/package.json'); console.log('typescript='+p.version)"
            )
          done
      - name: Commit generated lockfiles once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- evidence/ts-lockfiles/*/package-lock.json; then
            echo 'lockfiles already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/ts-lockfiles/*/package-lock.json
          git commit -m 'test: materialize npm-generated TypeScript lockfiles'
          git push origin HEAD:proof/generate-ts-lockfiles-20260928
