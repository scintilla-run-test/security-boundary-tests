name: BeamScale supervisor PR111 lifecycle proof

on:
  pull_request:
    paths:
      - '.github/workflows/bmscl-supervisor-111.yml'
      - 'evidence/bmscl-supervisor-111/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bmscl-supervisor-111.yml'
      - 'evidence/bmscl-supervisor-111/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact production source identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/bmscl-supervisor-111'
          for file in bmscl_runtime.erl bmscl_host_lifecycle_socket.erl; do
            expected="$(jq -r --arg file "$file" '.files[$file]' "$root/source-lock.json")"
            actual="$(git hash-object "$root/src/$file")"
            test "$actual" = "$expected" || {
              echo "vendored BeamScale source mismatch for $file: expected=$expected actual=$actual" >&2
              exit 1
            }
          done
          commit="$(jq -r '.commit_sha' "$root/source-lock.json")"
          case "$commit" in
            (*[!0-9a-f]*|'') echo 'invalid BeamScale production commit lock' >&2; exit 1 ;;
          esac
          test "${#commit}" -eq 40

      - name: Install Erlang test toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y erlang-base erlang-dev erlang-eunit erlang-tools
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt(0).'

      - name: Compile exact lifecycle sources and hostile contract manager
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          mkdir -p ebin
          erlc -Werror +debug_info -o ebin test_support/bmscl_deployment_manager.erl
          erlc -Werror +debug_info -o ebin src/bmscl_runtime.erl src/bmscl_host_lifecycle_socket.erl
          erlc -Werror +debug_info -o ebin test/bmscl_lifecycle_carrier_tests.erl

      - name: Run owner, stale-runtime, and protocol adversarial tests
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          erl -noshell -pa ebin -eval '
            case eunit:test(bmscl_lifecycle_carrier_tests, [verbose]) of
              ok -> halt(0);
              _ -> halt(1)
            end.
          '

      - name: Reject accidental wire serialization of local Erlang authority
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          if grep -nE 'term_to_binary|binary_to_term' src/bmscl_host_lifecycle_socket.erl; then
            echo 'lifecycle socket must not serialize local Erlang PIDs/references' >&2
            exit 1
          fi
