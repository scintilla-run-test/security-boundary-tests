name: BeamScale supervisor PR111 lifecycle proof

on:
  pull_request:
    paths:
      - '.github/workflows/bmscl-supervisor-111.yml'
      - 'evidence/bmscl-supervisor-111/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bmscl-supervisor-111.yml'
      - 'evidence/bmscl-supervisor-111/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact production source identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/bmscl-supervisor-111'
          for file in bmscl_runtime.erl bmscl_host_lifecycle_socket.erl; do
            expected="$(jq -r --arg file "$file" '.files[$file]' "$root/source-lock.json")"
            actual="$(git hash-object "$root/src/$file")"
            test "$actual" = "$expected" || {
              echo "vendored BeamScale source mismatch for $file: expected=$expected actual=$actual" >&2
              exit 1
            }
          done
          commit="$(jq -r '.commit_sha' "$root/source-lock.json")"
          case "$commit" in
            (*[!0-9a-f]*|'') echo 'invalid BeamScale production commit lock' >&2; exit 1 ;;
          esac
          test "${#commit}" -eq 40

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3'

      - name: Compile exact lifecycle sources and hostile contract manager
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt(0).'
          mkdir -p ebin
          erlc -Werror +debug_info -o ebin test_support/bmscl_deployment_manager.erl
          erlc -Werror +debug_info -o ebin src/bmscl_runtime.erl src/bmscl_host_lifecycle_socket.erl
          erlc -Werror +debug_info -o ebin test/bmscl_lifecycle_carrier_tests.erl

      - name: Run owner, stale-runtime, peer-auth, and protocol adversarial tests
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          erl -noshell -pa ebin -eval '
            case eunit:test(bmscl_lifecycle_carrier_tests, [verbose]) of
              ok -> halt(0);
              _ -> halt(1)
            end.
          '

      - name: Prove native Linux SO_PEERCRED shape on production OTP line
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          erl -noshell -pa ebin -eval '
            Path = "/tmp/bmscl-peercred-carrier.sock",
            _ = file:delete(Path),
            {ok, Listener} = socket:open(local, stream, default),
            ok = socket:bind(Listener, #{family => local, path => Path}),
            ok = socket:listen(Listener, 1),
            Parent = self(),
            Client = spawn(fun() ->
                {ok, C} = socket:open(local, stream, default),
                ok = socket:connect(C, #{family => local, path => Path}),
                Parent ! {client_connected, self()},
                receive stop -> ok end,
                ok = socket:close(C)
            end),
            {ok, Accepted} = socket:accept(Listener),
            receive {client_connected, Client} -> ok after 1000 -> error(client_connect_timeout) end,
            {ok, Raw} = socket:getopt_native(Accepted, {1, 17}, 12),
            {ok, #{pid := Pid, uid := Uid, gid := Gid}} =
                bmscl_host_lifecycle_socket:decode_peer_credentials_for_test(Raw),
            true = is_integer(Pid) andalso Pid >= 0,
            true = is_integer(Uid) andalso Uid >= 0,
            true = is_integer(Gid) andalso Gid >= 0,
            ok = bmscl_host_lifecycle_socket:authorize_peer_for_test(
                #{pid => Pid, uid => Uid, gid => Gid}, #{uid => Uid, gid => Gid}),
            {error, unauthorized_peer} = bmscl_host_lifecycle_socket:authorize_peer_for_test(
                #{pid => Pid, uid => Uid, gid => Gid}, #{uid => Uid + 1, gid => Gid}),
            Client ! stop,
            ok = socket:close(Accepted),
            ok = socket:close(Listener),
            _ = file:delete(Path),
            halt(0).
          '

      - name: Verify hardened socket boundary source shape
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          grep -F 'socket:getopt_native' src/bmscl_host_lifecycle_socket.erl
          grep -F 'BMSCL_LIFECYCLE_AGENT_UID' src/bmscl_host_lifecycle_socket.erl
          grep -F 'BMSCL_LIFECYCLE_AGENT_GID' src/bmscl_host_lifecycle_socket.erl
          if awk '/open_listener\(Path\) ->/{flag=1} /bind_listener\(Listener, Path\) ->/{flag=0} flag' src/bmscl_host_lifecycle_socket.erl | grep -F 'file:delete'; then
            echo 'open_listener must never unlink a pre-existing socket path' >&2
            exit 1
          fi

      - name: Reject accidental wire serialization of local Erlang authority
        shell: bash
        working-directory: evidence/bmscl-supervisor-111
        run: |
          set -euo pipefail
          if grep -nE 'term_to_binary|binary_to_term' src/bmscl_host_lifecycle_socket.erl; then
            echo 'lifecycle socket must not serialize local Erlang PIDs/references' >&2
            exit 1
          fi
