name: Process isolation resolved-process redaction exact-source proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Verify exact production blob identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/ores-proc-isolation-cli-28'
          test "$(jq -r '.pull_request' "$root/source-lock.json")" = '31'
          test "$(jq -r '.commit_sha' "$root/source-lock.json")" = '0c079871f01543849f2255bcf4432dc92cb55690'
          jq -r '.files | to_entries[] | [.key,.value] | @tsv' "$root/source-lock.json" |
          while IFS=$'\t' read -r path expected; do
            actual="$(git hash-object "$root/$path")"
            test "$actual" = "$expected" || {
              echo "source mismatch for $path: expected=$expected actual=$actual" >&2
              exit 1
            }
          done

      - name: Rustfmt exact source closure
        working-directory: evidence/ores-proc-isolation-cli-28
        run: cargo fmt --all -- --check

      - name: Clippy exact source closure
        working-directory: evidence/ores-proc-isolation-cli-28
        run: cargo clippy --lib --tests --locked -- -D warnings

      - name: Run exact library tests
        working-directory: evidence/ores-proc-isolation-cli-28
        run: cargo test --lib --locked

      - name: Prove resolved-process secret serialization regression
        working-directory: evidence/ores-proc-isolation-cli-28
        run: cargo test --lib --locked resolved_process_serialization_omits_environment_values -- --nocapture
