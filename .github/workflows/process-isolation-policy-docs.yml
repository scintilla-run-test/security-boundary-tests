name: Process isolation policy docs proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-test-crate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Verify exact production integration-test blob
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/ores-proc-isolation-cli-27'
          expected="$(jq -r '.git_blob_sha' "$root/source-lock.json")"
          actual="$(git hash-object "$root/tests/policy_contract_authority.rs")"
          test "$actual" = "$expected" || {
            echo "vendored integration test does not match production blob: expected=$expected actual=$actual" >&2
            exit 1
          }

      - name: Prove strict docs lint and test compilation
        shell: bash
        run: |
          set -euo pipefail
          cd evidence/ores-proc-isolation-cli-27
          cargo fmt --check
          cargo clippy --tests -- -D warnings
          cargo test --no-run
