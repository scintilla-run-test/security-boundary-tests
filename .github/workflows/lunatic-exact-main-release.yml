name: Lunatic exact merged main release proof

on:
  push:
    branches:
      - probe/lunatic-exact-main-release-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Lunatic exact main (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lunatic-lorry/ll-desktop-daemon
          ref: df380a882a457706fcf2fe1dffc0e2e532aa5fad
          persist-credentials: false
      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - name: Exact-head release validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = df380a882a457706fcf2fe1dffc0e2e532aa5fad
          cargo fmt --all -- --check
          cargo test --all-targets --release
          cargo clippy --all-targets -- -D warnings
