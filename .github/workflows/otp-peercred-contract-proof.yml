name: OTP peercred contract proof

on:
  pull_request:
    paths:
      - '.github/workflows/otp-peercred-contract-proof.yml'
      - 'evidence/otp-peercred/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/otp-peercred-contract-proof.yml'
      - 'evidence/otp-peercred/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peercred:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install BeamScale-certified Erlang runtime
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3'
          rebar3-version: '3.24.0'

      - name: Verify OTP release
        shell: bash
        run: |
          set -euo pipefail
          erl -noshell -eval '"'"'"27" = erlang:system_info(otp_release), io:format("OTP=~s~n", [erlang:system_info(otp_release)]), halt(0).'"'"'

      - name: Compile peer credential probe
        shell: bash
        run: |
          set -euo pipefail
          cd evidence/otp-peercred
          erlc +warnings_as_errors peercred_probe.erl

      - name: Run connected Unix-socket peer credential probe
        shell: bash
        run: |
          set -euo pipefail
          cd evidence/otp-peercred
          erl -noshell -pa . -s peercred_probe main
