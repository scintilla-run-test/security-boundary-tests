name: wasm-xprs exact merged main live proof

on:
  push:
    branches:
      - probe/wasmx-exact-main-live-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact daemon main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-daemon
          ref: 9906d0bdfc4fe1760fca75569670f91e793e1c85
          path: daemon
          persist-credentials: false
      - name: Checkout exact CLI main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-cli
          ref: 265c4768f22ea78d020f8eebcdba4795654d652f
          path: cli
          persist-credentials: false
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
      - name: Build exact mains
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path daemon/Cargo.toml
          cargo build --manifest-path cli/Cargo.toml
      - name: Live doctor and exact receipt proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('fixture')
          module = bytes.fromhex(
              '0061736d01000000'
              '0105016000017f'
              '03020100'
              '0503010001'
              '071702066d656d6f727902000a7761736d785f6d61696e0000'
              '0a0601040041000b'
          )
          drift = bytes.fromhex(
              '0061736d01000000'
              '0105016000017f'
              '03020100'
              '0503010001'
              '071702066d656d6f727902000a7761736d785f6d61696e0000'
              '0a0601040041010b'
          )
          (root/'module.wasm').write_bytes(module)
          (root/'drift.wasm').write_bytes(drift)
          source_sha = 'c' * 64
          adapter = {
              'schema_version':'ores.lambda.adapter/v1',
              'generated_by':'ores-stack',
              'provider':'wasm_xprs',
              'runtime_repository':'wasm-xprs/wasmx-lambdas',
              'runtime_contract':'wasm-xprs.lambda-runtime/v1',
              'execution_boundary':'wasmtime_store_instance',
              'isolation_model':'fresh_store_and_instance_per_invocation',
              'artifact_kind':'wasm_module',
              'module_cache_policy':'compiled_module_allowed',
              'invocation_instance_reuse':'forbidden',
              'ambient_import_policy':'explicit_wasmx_v1_only',
              'durable_state':'external_only',
              'source':'src/routes/echo/lambda.rs',
              'source_sha256':source_sha,
          }
          adapter_bytes = json.dumps(adapter,separators=(',',':'),sort_keys=True).encode()
          (root/'adapter.json').write_bytes(adapter_bytes)
          receipt = {
              'schema_version':'ores.lambda.wasm-artifact.receipt/v1',
              'generated_by':'ores-stack',
              'provider':'wasm_xprs',
              'runtime_repository':'wasm-xprs/wasmx-lambdas',
              'runtime_contract':'wasm-xprs.lambda-runtime/v1',
              'adapter_contract':'ores.lambda.adapter/v1',
              'artifact_path':'build/lambda/wasm_xprs/module.wasm',
              'artifact_sha256':hashlib.sha256(module).hexdigest(),
              'deploy_mutation_performed':False,
              'target_triple':'wasm32-unknown-unknown',
              'adapter_path':'generated/lambda-adapters/wasm_xprs/adapter.json',
              'adapter_sha256':hashlib.sha256(adapter_bytes).hexdigest(),
              'source_path':'src/routes/echo/lambda.rs',
              'source_sha256':source_sha,
              'cargo_manifest_path':'Cargo.toml',
              'cargo_package':'exact-main-proof',
              'cargo_target_name':'ores_wasm_lambda_unit',
              'wrapper_sha256':'d'*64,
              'unit_manifest_sha256':'e'*64,
          }
          (root/'receipt.json').write_text(json.dumps(receipt,separators=(',',':'),sort_keys=True))
          bad = dict(receipt); bad['artifact_sha256']='0'*64
          (root/'bad-receipt.json').write_text(json.dumps(bad,separators=(',',':'),sort_keys=True))
          PY

          export HOME="$RUNNER_TEMP/wasmx-main-home"
          export WASMX_ARTIFACT_ROOT="$RUNNER_TEMP/wasmx-main-artifacts"
          mkdir -p "$HOME"
          ./daemon/target/debug/wasmx-desktop-daemon >"$RUNNER_TEMP/daemon.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8766/healthz >/dev/null; then break; fi
            sleep 0.25
          done
          if curl --max-time 1 -fsS http://127.0.0.1:8765/healthz >/dev/null 2>&1; then
            echo 'legacy port 8765 unexpectedly active' >&2; exit 1
          fi

          (cd cli && ./target/debug/wasmx-desktop-cli doctor) >"$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['ready'] is True, v
          assert v['runtime_contract_verified'] is True, v
          assert v['status']['target_triple']=='wasm32-unknown-unknown', v
          assert v['status']['wasi_enabled'] is False, v
          PY

          MODULE="$GITHUB_WORKSPACE/fixture/module.wasm"
          ADAPTER="$GITHUB_WORKSPACE/fixture/adapter.json"
          RECEIPT="$GITHUB_WORKSPACE/fixture/receipt.json"
          (cd cli && ./target/debug/wasmx-desktop-cli deploy \
            --tenant main-proof --deployment gen-1 --module "$MODULE" \
            --ores-adapter "$ADAPTER" --ores-receipt "$RECEIPT") >"$RUNNER_TEMP/deploy.json"
          python3 - "$RUNNER_TEMP/deploy.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['compiled'] is True, v
          assert v['ores_adapter_verified'] is True, v
          assert v['ores_receipt_verified'] is True, v
          PY
          (cd cli && ./target/debug/wasmx-desktop-cli inspect \
            --tenant main-proof --deployment gen-1) >"$RUNNER_TEMP/inspect.json"
          python3 - "$RUNNER_TEMP/inspect.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['integrity_verified'] is True, v
          assert v['ores_provenance_bound'] is True, v
          assert v['ores_build_receipt_bound'] is True, v
          PY

          if (cd cli && ./target/debug/wasmx-desktop-cli deploy \
              --tenant main-proof --deployment bad-receipt --module "$MODULE" \
              --ores-adapter "$ADAPTER" --ores-receipt "$GITHUB_WORKSPACE/fixture/bad-receipt.json"); then
            echo 'tampered receipt accepted' >&2; exit 1
          fi
          if (cd cli && ./target/debug/wasmx-desktop-cli deploy \
              --tenant main-proof --deployment gen-1 --module "$GITHUB_WORKSPACE/fixture/drift.wasm"); then
            echo 'immutable deployment accepted drift bytes' >&2; exit 1
          fi
