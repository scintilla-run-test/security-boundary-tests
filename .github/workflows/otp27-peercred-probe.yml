name: OTP 27.3 Unix peercred probe

on:
  pull_request:
    paths:
      - '.github/workflows/otp27-peercred-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3'
      - name: Probe connected AF_UNIX peer credentials
        shell: bash
        run: |
          set -euo pipefail
          erl -noshell -eval '
            Path = "/tmp/otp27-peercred-probe.sock",
            _ = file:delete(Path),
            {ok, Listener} = socket:open(local, stream, default),
            ok = socket:bind(Listener, #{family => local, path => Path}),
            ok = socket:listen(Listener, 1),
            Parent = self(),
            Client = spawn(fun() ->
                {ok, C} = socket:open(local, stream, default),
                ok = socket:connect(C, #{family => local, path => Path}),
                Parent ! {client_connected, self()},
                receive stop -> ok end,
                ok = socket:close(C)
            end),
            {ok, Accepted} = socket:accept(Listener),
            receive {client_connected, Client} -> ok after 1000 -> error(client_connect_timeout) end,
            NamedSupported = socket:is_supported(options, {socket, peercred}),
            NamedPeerCred = socket:getopt(Accepted, {socket, peercred}),
            NativePeerCred = socket:getopt_native(Accepted, {1, 17}, 12),
            io:format("named_peercred_supported=~p named_peercred=~p native_peercred=~p~n",
                      [NamedSupported, NamedPeerCred, NativePeerCred]),
            Client ! stop,
            ok = socket:close(Accepted),
            ok = socket:close(Listener),
            _ = file:delete(Path),
            case NativePeerCred of
                {ok, <<Pid:32/native-signed, Uid:32/native-unsigned, Gid:32/native-unsigned>>}
                  when Pid > 0, Uid >= 0, Gid >= 0 ->
                    io:format("decoded_peercred pid=~B uid=~B gid=~B~n", [Pid, Uid, Gid]),
                    halt(0);
                Other ->
                    io:format("unexpected_native_peercred=~p~n", [Other]),
                    halt(1)
            end.
          '
