name: Scintilla infra PR41 lifecycle proof

on:
  pull_request:
    paths:
      - '.github/workflows/scintilla-infra-41.yml'
      - 'evidence/scintilla-infra-41/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact production source identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/scintilla-infra-41'
          for file in \
            fleet/nixos/scintilla-lifecycle-agent.nix \
            scripts/check-lifecycle-agent-contract.mjs; do
            expected="$(jq -r --arg file "$file" '.files[$file]' "$root/source-lock.json")"
            actual="$(git hash-object "$root/$file")"
            test "$actual" = "$expected" || {
              echo "vendored Scintilla infra source mismatch for $file: expected=$expected actual=$actual" >&2
              exit 1
            }
          done
          test "$(jq -r '.commit_sha' "$root/source-lock.json")" = 'f90981eb6177d34951871e81e93e8b8f0b88e9ca'

      - name: Run exact lifecycle observer contract checker
        shell: bash
        working-directory: evidence/scintilla-infra-41
        run: |
          set -euo pipefail
          node scripts/check-lifecycle-agent-contract.mjs

      - name: Parse exact NixOS module
        shell: bash
        working-directory: evidence/scintilla-infra-41
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nix-bin
          nix-instantiate --parse fleet/nixos/scintilla-lifecycle-agent.nix >/dev/null

      - name: Enforce observe-only privilege boundary
        shell: bash
        working-directory: evidence/scintilla-infra-41
        run: |
          set -euo pipefail
          module='fleet/nixos/scintilla-lifecycle-agent.nix'
          grep -F 'ORES_PROCESS_LIFECYCLE_EFFECTS_ENABLED = "false"' "$module"
          grep -F 'ORES_PROCESS_LIFECYCLE_HIBERNATE_ENABLED = "false"' "$module"
          grep -F 'ProtectControlGroups = true' "$module"
          grep -F 'RestrictAddressFamilies = [ "AF_UNIX" ]' "$module"
          grep -F 'CapabilityBoundingSet = [ ]' "$module"
          grep -F 'AmbientCapabilities = [ ]' "$module"
          grep -F '"${cfg.package}/bin/${cfg.binary} probe-product"' "$module"
          grep -F '"scintilla-runtime.service"' "$module"
          if grep -Eq 'CAP_SYS_ADMIN|CAP_SYS_PTRACE|CAP_DAC_OVERRIDE|LoadCredential|ProtectControlGroups = false' "$module"; then
            echo 'observe-only module gained premature mutation/credential authority' >&2
            exit 1
          fi
