name: BeamScale infra PR76 lifecycle proof

on:
  pull_request:
    paths:
      - '.github/workflows/bmscl-infra-76.yml'
      - 'evidence/bmscl-infra-76/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact production source identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/bmscl-infra-76'
          for file in \
            deploy/baremetal/nixos/bmscl-lifecycle-agent.nix \
            deploy/baremetal/README.md \
            deploy/baremetal/process-lifecycle.md \
            scripts/check-lifecycle-agent-contract.mjs; do
            expected="$(jq -r --arg file "$file" '.files[$file]' "$root/source-lock.json")"
            actual="$(git hash-object "$root/$file")"
            test "$actual" = "$expected" || {
              echo "vendored BeamScale infra source mismatch for $file: expected=$expected actual=$actual" >&2
              exit 1
            }
          done
          commit="$(jq -r '.commit_sha' "$root/source-lock.json")"
          test "$commit" = '8483dc08cfd07f85a44c980d6d59f32603b86347'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Run exact lifecycle contract checker
        shell: bash
        working-directory: evidence/bmscl-infra-76
        run: |
          set -euo pipefail
          node scripts/check-lifecycle-agent-contract.mjs

      - name: Parse exact NixOS module
        shell: bash
        working-directory: evidence/bmscl-infra-76
        run: |
          set -euo pipefail
          nix-instantiate --parse deploy/baremetal/nixos/bmscl-lifecycle-agent.nix >/dev/null

      - name: Enforce observe-only privilege and product-bridge boundary
        shell: bash
        working-directory: evidence/bmscl-infra-76
        run: |
          set -euo pipefail
          module='deploy/baremetal/nixos/bmscl-lifecycle-agent.nix'
          grep -F 'ORES_PROCESS_LIFECYCLE_EFFECTS_ENABLED = "false"' "$module"
          grep -F 'ProtectControlGroups = true' "$module"
          grep -F 'RestrictAddressFamilies = [ "AF_UNIX" ]' "$module"
          grep -F 'CapabilityBoundingSet = [ ]' "$module"
          grep -F 'AmbientCapabilities = [ ]' "$module"
          grep -F 'SupplementaryGroups = [ controlGroup ]' "$module"
          grep -F 'BMSCL_LIFECYCLE_SOCKET = productSocket' "$module"
          grep -F '"${cfg.package}/bin/${cfg.binary} probe-product"' "$module"
          grep -F 'productUnit' "$module"
          if grep -Eq 'CAP_SYS_ADMIN|CAP_SYS_PTRACE|CAP_DAC_OVERRIDE|LoadCredential|ProtectControlGroups = false' "$module"; then
            echo 'observe-only module gained premature host mutation/credential authority' >&2
            exit 1
          fi
